name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tests
        run: python -m pip install pytest
      - name: Syntax check
        run: python -m compileall -q custom_components tests
      - name: Parser tests
        run: python -m pytest -q tests
